# Секреты — ЗАПОЛНИТЬ СВОИМИ ЗНАЧЕНИЯМИ и не коммитить в публичный репозиторий.
#   kubectl create secret generic osint-secrets \
#     --from-literal=API_KEYS='admin:смените,analyst:смените,viewer:смените' \
#     --from-literal=VK_TOKEN='...' --from-literal=SERPER_API_KEY='...'
# (этот файл — каркас с плейсхолдерами)
apiVersion: v1
kind: Secret
metadata:
  name: osint-secrets
type: Opaque
stringData:
  API_KEYS: "admin:CHANGE_ME,analyst:CHANGE_ME,viewer:CHANGE_ME"
  VK_TOKEN: ""
  SERPER_API_KEY: ""
  SERPAPI_KEY: ""
  GOOGLE_API_KEY: ""
  GOOGLE_CSE_ID: ""
